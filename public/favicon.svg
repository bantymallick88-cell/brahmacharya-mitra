<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <radialGradient id="badgeBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#24140a" />
      <stop offset="55%" stop-color="#0f0906" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Metallic Gold/Saffron Border Gradient -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inner Subtle Gold Glow -->
    <linearGradient id="innerRim" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.05" />
    </linearGradient>

    <!-- Outer Flame Layer: Saffron to Amber -->
    <linearGradient id="outerFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Mid Flame Layer: Vibrant Amber to Light Gold -->
    <linearGradient id="midFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Core Transmuted Ojas Flame: Radiant White-Gold -->
    <linearGradient id="coreFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Lotus Petals Gold Gradient -->
    <linearGradient id="lotusPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Ambient Aura Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Sparkle Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── 1. Luxury Squircle Badge Container ── -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#badgeBg)" stroke="url(#borderGold)" stroke-width="7" />
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#innerRim)" stroke-width="2" />

  <!-- ── 2. Subtle Sacred Geometry Radiance Ring ── -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#ea580c" stroke-opacity="0.08" stroke-width="1" />

  <!-- ── 3. Sacred Lotus Base (Padma — Purity & Non-Attachment) ── -->
  <!-- Far Left Lateral Leaf -->
  <path d="M 256 382 C 205 382 142 360 102 316 C 144 314 200 336 244 362 Z" fill="url(#lotusPetalGrad)" opacity="0.8" />
  <!-- Far Right Lateral Leaf -->
  <path d="M 256 382 C 307 382 370 360 410 316 C 368 314 312 336 268 362 Z" fill="url(#lotusPetalGrad)" opacity="0.8" />

  <!-- Mid Left Lotus Petal -->
  <path d="M 256 388 C 202 388 152 344 136 288 C 172 304 220 334 252 368 Z" fill="url(#lotusPetalGrad)" opacity="0.95" />
  <!-- Mid Right Lotus Petal -->
  <path d="M 256 388 C 310 388 360 344 376 288 C 340 304 292 334 260 368 Z" fill="url(#lotusPetalGrad)" opacity="0.95" />

  <!-- Center Lotus Cradle Pedestal -->
  <path d="M 256 406 C 218 406 174 380 162 344 C 196 352 232 368 256 390 C 280 368 316 352 350 344 C 338 380 294 406 256 406 Z" fill="url(#outerFlameGrad)" />

  <!-- ── 4. Radiant Brahmacharya Flame (Tejas / Upward Transmuted Energy) ── -->
  <!-- Outer Flame Body (Vibrant Saffron-Amber) -->
  <path d="M 256 78 C 256 78 338 180 338 268 C 338 334 294 372 256 372 C 218 372 174 334 174 268 C 174 180 256 78 256 78 Z" fill="url(#outerFlameGrad)" filter="url(#softGlow)" />

  <!-- Mid Sculpted Flame (Golden Amber Radiance) -->
  <path d="M 256 120 C 278 178 310 228 310 278 C 310 328 280 354 256 354 C 232 354 202 328 202 278 C 202 228 234 178 256 120 Z" fill="url(#midFlameGrad)" />

  <!-- Core Transmuted Ojas Flame (Electric Golden-White Core) -->
  <path d="M 256 166 C 268 208 284 248 284 286 C 284 322 270 338 256 338 C 242 338 228 322 228 286 C 228 248 244 208 256 166 Z" fill="url(#coreFlameGrad)" />

  <!-- Divine Bindu — The Point of Supreme Focus & Pure Vitality -->
  <ellipse cx="256" cy="292" rx="14" ry="20" fill="#ffffff" filter="url(#sparkleGlow)" opacity="0.98" />
  <circle cx="256" cy="292" r="7" fill="#fef08a" />
</svg>